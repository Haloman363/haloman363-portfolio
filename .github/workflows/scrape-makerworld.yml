name: Scrape MakerWorld stats

on:
  schedule:
    - cron: '0 13 * * *' # daily, 6am MT (accounts for DST drift ±1hr)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Scrape MakerWorld profile
        id: scrape
        run: node scripts/scrape-makerworld.mjs
      # Snapshots live on their own branch so the daily update doesn't flood
      # master's history. The deploy workflow pulls the latest one at build time.
      - name: Commit snapshot to makerworld-data branch
        if: steps.scrape.outputs.scraped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/data/makerworld-snapshot.json "$RUNNER_TEMP/snapshot.json"
          git checkout -- src/data/makerworld-snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin makerworld-data >/dev/null; then
            git fetch origin makerworld-data
            git checkout -B makerworld-data origin/makerworld-data
          else
            git checkout --orphan makerworld-data
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/snapshot.json" makerworld-snapshot.json
          git add makerworld-snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "chore: update MakerWorld stats snapshot"
          git push origin makerworld-data
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so redeploy explicitly.
          gh workflow run deploy.yml --ref master
