name: Scrape MakerWorld stats

on:
  schedule:
    - cron: '0 13 * * *' # daily, 6am MT (accounts for DST drift ±1hr)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scrape-makerworld.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/makerworld-snapshot.json
          git diff --staged --quiet || git commit -m "chore: update MakerWorld stats snapshot"
          git push
