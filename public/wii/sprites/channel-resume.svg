<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" width="340" height="186">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6eef5"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1e2740" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="340" height="186" fill="url(#bg)"/>

  <!-- Page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M136 22 H190 L212 44 V130 Q212 138 204 138 H136 Q128 138 128 130 V30 Q128 22 136 22 Z"
          fill="url(#page)" stroke="#c9d4e2" stroke-width="1.5"/>
  </g>
  <path d="M190 22 V38 Q190 44 196 44 H212 Z" fill="#d5e0ee" stroke="#c9d4e2" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Photo + name -->
  <circle cx="147" cy="58" r="10" fill="#3a4a6b"/>
  <circle cx="147" cy="55" r="3.6" fill="#fff"/>
  <path d="M140 65 Q147 58 154 65" fill="#fff"/>
  <rect x="163" y="51" width="30" height="6" rx="3" fill="#3a4a6b"/>
  <rect x="163" y="62" width="21" height="4" rx="2" fill="#9fb0c8"/>

  <!-- Sections -->
  <rect x="140" y="80" width="24" height="4.5" rx="2.2" fill="#36c1ec"/>
  <rect x="140" y="90" width="60" height="4" rx="2" fill="#c8d2e0"/>
  <rect x="140" y="99" width="60" height="4" rx="2" fill="#c8d2e0"/>
  <rect x="140" y="108" width="40" height="4" rx="2" fill="#c8d2e0"/>
  <rect x="140" y="119" width="24" height="4.5" rx="2.2" fill="#36c1ec"/>

  <!-- PDF-ready badge -->
  <circle cx="206" cy="124" r="15" fill="#36c1ec" stroke="#ffffff" stroke-width="3"/>
  <polyline points="199,124 204,129 213,118" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="170" y="168" font-family="'Nunito',Arial,sans-serif" font-weight="900" font-size="26" fill="#2f3f63" text-anchor="middle">Resume</text>
</svg>
