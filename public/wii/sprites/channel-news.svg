<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" width="340" height="186">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6eef5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="icon"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <rect width="340" height="186" fill="url(#bg)"/>
  <!-- Folded newspaper on an amber rounded square -->
  <g transform="translate(110,20) scale(1.875)" clip-path="url(#icon)">
    <rect width="64" height="64" fill="url(#amber)"/>
    <rect x="12" y="13" width="40" height="38" rx="4" fill="#ffffff"/>
    <rect x="17" y="18" width="30" height="7" rx="1.5" fill="#d97706"/>
    <rect x="17" y="29" width="13" height="10" rx="1.5" fill="#fcd9a0"/>
    <g fill="#9ca3af">
      <rect x="33" y="29" width="14" height="2.6" rx="1.3"/>
      <rect x="33" y="34" width="14" height="2.6" rx="1.3"/>
      <rect x="33" y="39" width="10" height="2.6" rx="1.3"/>
      <rect x="17" y="44" width="30" height="2.6" rx="1.3"/>
    </g>
  </g>
  <!-- Label -->
  <text x="170" y="168" font-family="'Nunito',Arial,sans-serif" font-weight="900" font-size="26" fill="#b45309" text-anchor="middle">News</text>
</svg>
