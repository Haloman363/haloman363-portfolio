<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" width="340" height="186">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6eef5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5bb8f5"/>
      <stop offset="100%" stop-color="#2a7fd0"/>
    </linearGradient>
    <clipPath id="icon"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <rect width="340" height="186" fill="url(#bg)"/>
  <!-- Sun peeking from behind a cloud on a sky-blue rounded square -->
  <g transform="translate(110,20) scale(1.875)" clip-path="url(#icon)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <g transform="translate(40 24)">
      <g stroke="#ffd34d" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <line x1="0" y1="-15" x2="0" y2="-20"/><line x1="0" y1="15" x2="0" y2="20"/>
        <line x1="-15" y1="0" x2="-20" y2="0"/><line x1="15" y1="0" x2="20" y2="0"/>
        <line x1="-10.6" y1="-10.6" x2="-14" y2="-14"/><line x1="10.6" y1="10.6" x2="14" y2="14"/>
        <line x1="-10.6" y1="10.6" x2="-14" y2="14"/><line x1="10.6" y1="-10.6" x2="14" y2="-14"/>
      </g>
      <circle r="11" fill="#ffd34d"/>
    </g>
    <path d="M14 52h30a9 9 0 0 0 1.3-17.9A13 13 0 0 0 20.2 37 8 8 0 0 0 14 52z" fill="#ffffff"/>
  </g>
  <!-- Label -->
  <text x="170" y="168" font-family="'Nunito',Arial,sans-serif" font-weight="900" font-size="26" fill="#1d6fa8" text-anchor="middle">Forecast</text>
</svg>
