<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" width="340" height="186">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6eef5"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d7f74"/>
    </linearGradient>
    <linearGradient id="back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fe3d6"/>
      <stop offset="100%" stop-color="#3fc4b4"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f5a800"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#064e46" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="340" height="186" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Referred person (behind) -->
    <circle cx="196" cy="66" r="15" fill="url(#back)"/>
    <path d="M166 128 V120 C166 98 178 86 196 86 C214 86 226 98 226 120 V128 Z" fill="url(#back)"/>
    <!-- Referrer (front, outlined so the pair reads as two people) -->
    <circle cx="146" cy="66" r="15" fill="url(#front)" stroke="#ffffff" stroke-width="3"/>
    <path d="M116 128 V120 C116 98 128 86 146 86 C164 86 176 98 176 120 V128 Z" fill="url(#front)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Hand-off arrow -->
  <path d="M146 42 Q171 22 193 40" fill="none" stroke="#f5a800" stroke-width="5" stroke-linecap="round"/>
  <polygon points="200,43 185,48 189,33" fill="#f5a800" stroke="#f5a800" stroke-width="2" stroke-linejoin="round"/>

  <!-- Reward coin -->
  <circle cx="214" cy="118" r="17" fill="url(#coin)" stroke="#ffffff" stroke-width="3"/>
  <text x="214" y="125" font-family="'Nunito',Arial,sans-serif" font-weight="900" font-size="21" fill="#a35a00" text-anchor="middle">$</text>

  <text x="170" y="168" font-family="'Nunito',Arial,sans-serif" font-weight="900" font-size="26" fill="#0f766e" text-anchor="middle">Referrals</text>
</svg>
